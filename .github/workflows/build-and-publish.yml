name: Build firmware and publish ESP32 installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esp32-admin-toolkit-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-web-publish.txt

      - name: Install PlatformIO and flash image tooling
        run: python -m pip install -r tools/requirements-web-publish.txt

      - name: Select firmware environment
        shell: bash
        run: |
          set -euo pipefail
          ENV_NAME="$(python -c 'from pathlib import Path; import sys; sys.path.insert(0,"tools"); from publish_web_firmware import default_environment; print(default_environment(Path("platformio.ini")))')"
          echo "PIO_ENV=$ENV_NAME" >> "$GITHUB_ENV"
          echo "Compiling PlatformIO environment $ENV_NAME from commit $GITHUB_SHA"

      - name: Compile current firmware
        run: pio run -e "$PIO_ENV"

      - name: Generate factory and update binaries, manifests and metadata
        run: python tools/publish_web_firmware.py --environment "$PIO_ENV"

      - name: Install Node for build-time dependency packaging
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vendor ESP Web Tools (website has no third-party JS at runtime)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --ignore-scripts esp-web-tools@10.4.0
          mkdir -p web/vendor/esp-web-tools
          cp -a node_modules/esp-web-tools/dist/web/. web/vendor/esp-web-tools/
          test -s web/vendor/esp-web-tools/install-button.js
          # ESP Web Tools is Apache-2.0 licensed. Keep its notice with the deployed code.
          if [ -f node_modules/esp-web-tools/LICENSE ]; then
            cp node_modules/esp-web-tools/LICENSE web/vendor/esp-web-tools/LICENSE
          fi

      - name: Download real device video image
        run: python tools/fetch_video_image.py

      - name: Validate the package
        run: python tools/verify_deploy.py

      - name: Save source-matched build as a GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-admin-pocket-toolkit-${{ github.sha }}
          path: |
            web/firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Publish the exact built website and binaries to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web
          force_orphan: true
          full_commit_message: deploy ${{ github.sha }}
